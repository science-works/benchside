[project]
name = "benchside"
version = "0.3.1"
description = "Research colleagues with private project memory and optional workflow reporting."
readme = "README.md"
authors = [
    { name = "Rory Byrne", email = "rory@rory.bio" }
]
requires-python = ">=3.11"
dependencies = [
    "dishka>=1.9.1",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
bench = "benchside.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchside"]

[tool.hatch.build.targets.wheel.force-include]
"content" = "benchside/_content"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260815",
    "pytest>=9.0.1",
    "ruff>=0.14.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
