[project]
name = "benchside"
version = "0.4.2"
description = "Research colleagues with private project memory and optional workflow reporting."
readme = "docs/package-description.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Rory Byrne", email = "rory@rory.bio" }
]
maintainers = [{ name = "Science Works" }]
keywords = ["research", "science", "agents", "research-journal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "dishka>=1.9.1",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
bench = "benchside.cli.main:main"

[project.urls]
Homepage = "https://github.com/science-works/benchside"
Documentation = "https://github.com/science-works/benchside/blob/main/SETUP.md"
Source = "https://github.com/science-works/benchside"
Issues = "https://github.com/science-works/benchside/issues"
Changelog = "https://github.com/science-works/benchside/releases"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["benchside", "content", "README.md", "SETUP.md", "LICENSE", "pyproject.toml", "uv.lock", "docs/package-description.md"]

[tool.hatch.build.targets.wheel]
packages = ["benchside"]

[tool.hatch.build.targets.wheel.force-include]
"content" = "benchside/_content"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260815",
    "pytest>=9.0.1",
    "ruff>=0.14.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
