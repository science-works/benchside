  <circle cx="60" cy="26" r="4.5" fill="#0e7c86" fill-opacity="0.55"/>
  <circle cx="78" cy="26" r="4.5" fill="#0e7c86" fill-opacity="0.25"/>
  <!-- the bench: worktop and legs -->
  <path d="M22 56 H98" stroke="#0e7c86" stroke-width="7" stroke-linecap="round"/>
  <path d="M34 56 V90" stroke="#0e7c86" stroke-width="7" stroke-linecap="round"/>
  <path d="M86 56 V90" stroke="#0e7c86" stroke-width="7" stroke-linecap="round"/>
  <!-- the journal: a line kept beneath the work -->
